name: Price alerts
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        run: |
          curl -fsS -X POST -H "X-Scrape-Token: ${{ secrets.SCRAPE_TOKEN }}" https://pc-parts-an-deals.onrender.com/api/check-alerts || true