<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PC Parts Deal Finder{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#0f172a; color:#e2e8f0; }
  .navbar { background:#1e293b; }
  .card { background:#1e293b; border:1px solid #334155; }
  .table { color:#e2e8f0; }
  .table thead th { color:#94a3b8; border-color:#334155; }
  .table td, .table th { border-color:#334155; vertical-align:middle; }
  .badge-src { font-size:.7rem; }
  .muted { color:#94a3b8; }
  a { color:#60a5fa; }
  .hero { background:linear-gradient(135deg,#1e293b,#0f172a); padding:2rem 0; }
  body.light { background:#f1f5f9; color:#0f172a; }
  body.light .navbar { background:#ffffff; }
  body.light .card { background:#ffffff; border:1px solid #cbd5e1; color:#0f172a; }
  body.light .table { color:#0f172a; }
  body.light .table thead th { color:#475569; border-color:#cbd5e1; }
  body.light .table td, body.light .table th { border-color:#cbd5e1; }
  body.light .muted { color:#475569; }
  body.light a { color:#2563eb; }
  body.light .filter-bar input, body.light .filter-bar select { background:#ffffff; color:#0f172a; border:1px solid #cbd5e1; }
  .stat { font-size:1.5rem; font-weight:700; }
  .filter-bar input, .filter-bar select { background:#0f172a; color:#e2e8f0; border:1px solid #334155; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">PC Parts Deal Finder</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <form class="d-flex me-3" action="/search" method="get">
        <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Search components..." aria-label="Search">
        <button class="btn btn-sm btn-primary" type="submit">Search</button>
      </form>
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
        {% for k, m in cats.items() %}
        <li class="nav-item"><a class="nav-link" href="/category/{{ k }}">{{ m.title }}</a></li>
        {% endfor %}
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/deals">Deals</a></li>
        <li class="nav-item"><a class="nav-link" href="/compare?cat=cpu">Compare</a></li>
        <li class="nav-item"><a class="nav-link" href="/build">Build</a></li>
        <li class="nav-item"><a class="nav-link" href="/watchlist">Watchlist</a></li>
        <li class="nav-item"><a class="nav-link" href="/compat">Compat</a></li>
        <li class="nav-item"><a class="nav-link" href="/sources">Sources</a></li>
        <li class="nav-item"><button class="btn btn-sm btn-outline-light ms-2" id="themeToggle" onclick="toggleTheme()">Light</button></li>
        <li class="nav-item"><a class="btn btn-sm btn-primary ms-2" href="/refresh">Refresh data</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-fluid">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function applyTheme(t){
  if (t === "light") { document.body.classList.add("light"); document.getElementById("themeToggle").textContent = "Dark"; }
  else { document.body.classList.remove("light"); document.getElementById("themeToggle").textContent = "Light"; }
}
function toggleTheme(){ const cur = document.body.classList.contains("light") ? "light" : "dark"; const next = cur==="light"?"dark":"light"; localStorage.setItem("theme", next); applyTheme(next); }
(function(){ applyTheme(localStorage.getItem("theme") || "dark"); })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
