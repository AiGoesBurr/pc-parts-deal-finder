{% extends "base.html" %}
{% block title %}Compare - PC Parts Deal Finder{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Compare: {{ meta.title }}</h2>
  <a class="btn btn-sm btn-primary" href="/category/{{ cat }}">Back to list</a>
</div>
<p class="muted small">Selected items are stored per category. Go back to the list to change selection.</p>
<div id="msg" class="muted"></div>
<div class="table-responsive">
  <table class="table table-sm table-bordered" id="ctbl">
    <thead id="chead"></thead>
    <tbody id="cbody"></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
const CAT = "{{ cat }}";
const SEL_KEY = "compare_"+CAT;
const selected = new Set(JSON.parse(localStorage.getItem(SEL_KEY) || "[]"));
const FIELDS = {
  cpu: ["name","brand","cores","mark","rank","price","value"],
  gpu: ["name","brand","score","price","value"],
  memory: ["name","brand","module_type","capacity_gb","price_per_gb","price","value"],
  storage: ["name","brand","storage_type","capacity_gb","price_per_gb","price","value"],
  psu: ["name","brand","wattage","efficiency","price_per_watt","price","value"],
  motherboard: ["name","brand","socket","form_factor","max_ram_gb","price","value"],
  case: ["name","brand","form_factor","color","price","value"],
  cooler: ["name","brand","radiator_size","decibels","price","value"],
};
function fmt(v){ if(v===null||v===undefined) return ""; if(typeof v==="object") return JSON.stringify(v); if(typeof v==="number") return Math.round(v*100)/100; return v; }
async function load(){
  if (selected.size < 2){ document.getElementById("msg").textContent = "Select at least 2 items on the category page."; return; }
  const res = await fetch("/api/data/"+CAT+"?limit=100000");
  const j = await res.json();
  const items = j.rows.filter(r => selected.has(r.name));
  if (items.length < 2){ document.getElementById("msg").textContent = "Selected items not found."; return; }
  const fields = FIELDS[CAT];
  const thead = document.getElementById("chead");
  thead.innerHTML = "<tr><th>Field</th>" + items.map(it=>`<th>${it.name}</th>`).join("") + "</tr>";
  const tbody = document.getElementById("cbody");
  tbody.innerHTML = fields.map(f => "<tr><td class='fw-semibold'>"+f.replace(/_/g," ")+"</td>" + items.map(it=>`<td>${fmt(it[f])}</td>`).join("") + "</tr>").join("");
}
load();
</script>
{% endblock %}
