{% extends "base.html" %}
{% block title %}Build Templates - PC Parts Deal Finder{% endblock %}
{% block content %}
<h2>Budget build templates</h2>
<p class="muted small">Auto-build a best-value PC within a target budget.</p>
<div class="row g-3">
  {% for b in [500, 800, 1000, 1500, 2000, 3000] %}
  <div class="col-md-4">
    <div class="card p-3 text-center">
      <h5>${{ b }} build</h5>
      <a class="btn btn-sm btn-primary mt-2" href="/build?budget={{ b }}">Build now</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
