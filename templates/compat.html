{% extends "base.html" %}
{% block title %}Compatibility Checker - PC Parts Deal Finder{% endblock %}
{% block content %}
<h1 class="h2">Build compatibility checker</h1>
<p class="muted small">Select parts to validate socket, memory type, and power requirements.</p>
<div class="row g-3">
  <div class="col-md-6"><label class="form-label small" for="sel_cpu">CPU</label><select id="sel_cpu" class="form-select form-select-sm"></select></div>
  <div class="col-md-6"><label class="form-label small" for="sel_mb">Motherboard</label><select id="sel_mb" class="form-select form-select-sm"></select></div>
  <div class="col-md-6"><label class="form-label small" for="sel_ram">RAM</label><select id="sel_ram" class="form-select form-select-sm"></select></div>
  <div class="col-md-6"><label class="form-label small" for="sel_gpu">GPU (optional)</label><select id="sel_gpu" class="form-select form-select-sm"></select></div>
  <div class="col-md-6"><label class="form-label small" for="sel_psu">PSU</label><select id="sel_psu" class="form-select form-select-sm"></select></div>
</div>
<button class="btn btn-sm btn-primary mt-3" onclick="check()">Check compatibility</button>
<div id="result" class="mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
const cache = {};
const REGION = "{{ region }}";
async function loadCat(cat){ if(cache[cat]) return cache[cat]; try { const r=await fetch("/api/data/"+cat+"?sort=value&order=desc&limit=1500&eligible=1&region="+encodeURIComponent(REGION)); const j=await r.json(); cache[cat]=j.rows||[]; } catch(e){ cache[cat]=[]; } return cache[cat]; }
function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function opt(rows, placeholder){ return `<option value="">${esc(placeholder)}</option>` + rows.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}</option>`).join(""); }
async function init(){
  const [cpu, mb, ram, gpu, psu] = await Promise.all([
    loadCat("cpu"), loadCat("motherboard"), loadCat("memory"), loadCat("gpu"), loadCat("psu")
  ]);
  document.getElementById("sel_cpu").innerHTML = opt(cpu, "-- CPU --");
  document.getElementById("sel_mb").innerHTML = opt(mb, "-- Motherboard --");
  document.getElementById("sel_ram").innerHTML = opt(ram, "-- RAM --");
  document.getElementById("sel_gpu").innerHTML = `<option value="">-- none --</option>` + gpu.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}</option>`).join("");
  document.getElementById("sel_psu").innerHTML = opt(psu, "-- PSU --");
}
function find(cat,name){ return (cache[cat]||[]).find(r=>r.name===name); }
function gpuWatts(score){
  const s = score || 0;
  if (s <= 0) return 250;
  for (const [limit, watts] of [[6000,120],[12000,180],[18000,230],[25000,290],[30000,340]]) {
    if (s < limit) return watts;
  }
  return 450;
}
function check(){
  const cpu=find("cpu", document.getElementById("sel_cpu").value);
  const mb=find("motherboard", document.getElementById("sel_mb").value);
  const ram=find("memory", document.getElementById("sel_ram").value);
  const gpu=find("gpu", document.getElementById("sel_gpu").value);
  const psu=find("psu", document.getElementById("sel_psu").value);
  const issues=[];
  const ok=[];
  function norm(s){ return s ? String(s).replace(/^Socket\s+/i,"").trim() : null; }
  const cs = norm(cpu && cpu.socket), ms = norm(mb && mb.socket);
  if (cpu && mb){
    if (cs && ms && cs===ms) ok.push("CPU socket matches motherboard ("+cs+").");
    else if (cs && ms) issues.push("CPU socket ("+cs+") does not match motherboard ("+ms+").");
    else ok.push("Socket could not be verified: CPU "+(cs||"unknown")+", motherboard "+(ms||"unknown")+". Check manually.");
  }
  if (ram && mb){
    if (ram.module_type && mb.ram_slots && (mb.max_ram_gb||0) >= (ram.capacity_gb||0)) ok.push("RAM fits motherboard capacity.");
    // type check: motherboard doesn't store ram type; check module_type present
    ok.push("RAM type: "+ram.module_type+". Verify motherboard supports "+ram.module_type+".");
  }
  if (psu && (cpu || gpu)){
    let load = 150;
    load += cpu ? (cpu.tdp || 105) : 0;
    if (gpu) load += gpuWatts(gpu.score);
    if (psu.wattage && psu.wattage >= load) ok.push("PSU "+psu.wattage+"W covers estimated load "+load+"W. Leave extra headroom for transient spikes.");
    else if (psu.wattage) issues.push("PSU "+psu.wattage+"W may be insufficient for estimated load "+load+"W.");
  }
  let html = "";
  if (issues.length) html += "<div class='alert alert-danger'><ul>"+issues.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ul></div>";
  if (ok.length) html += "<div class='alert alert-success'><ul>"+ok.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ul></div>";
  if (!cpu && !mb && !ram && !psu && !gpu) html = "<p class='muted'>Select parts to check.</p>";
  document.getElementById("result").innerHTML = html;
}
init();
</script>
{% endblock %}
